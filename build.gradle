plugins {
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

ext {
    pomUrl = 'https://github.com/aurbroszniowski/baton'
    pomScmConnection = 'scm:git:https://github.com/aurbroszniowski/baton.git'
    pomScmDeveloperConnection = 'scm:git:ssh://git@github.com:aurbroszniowski/baton.git'
    pomDeveloperId = (findProperty('pomDeveloperId') ?: 'aurbroszniowski').toString()
    pomDeveloperName = (findProperty('pomDeveloperName') ?: 'Aurelien Broszniowski').toString()
    pomDeveloperEmail = (findProperty('pomDeveloperEmail') ?: 'contact@jsoft.biz').toString()
    moduleDescriptions = [
            'baton-api' : 'Public Baton APIs: Fabric, NodeId, distributed primitive interfaces',
            'baton-core': 'Baton orchestrator runtime: HTTP server, in-memory state, and dispatch',
    ]
}

allprojects {
    group = (rootProject.findProperty('group') ?: 'io.github.aurbroszniowski.baton').toString()
    version = (rootProject.findProperty('version') ?: '1.0.0-SNAPSHOT').toString()

    repositories {
        mavenCentral()
        mavenLocal() // for Angela snapshots: cd /work/terracotta/github/angela && mvn install -DskipTests
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test) {
        useJUnitPlatform()
    }

    // baton-agent is an internal fat JAR embedded in baton-core — not published to Central
    if (project.name != 'baton-agent') {
        apply plugin: 'maven-publish'
        apply plugin: 'signing'

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java

                    pom {
                        name = "Baton ${project.name}"
                        description = rootProject.ext.moduleDescriptions.get(project.name, "Baton module ${project.name}")
                        url = rootProject.ext.pomUrl

                        licenses {
                            license {
                                name = 'Apache License, Version 2.0'
                                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            }
                        }

                        developers {
                            developer {
                                id = rootProject.ext.pomDeveloperId
                                name = rootProject.ext.pomDeveloperName
                                email = rootProject.ext.pomDeveloperEmail
                            }
                        }

                        scm {
                            connection = rootProject.ext.pomScmConnection
                            developerConnection = rootProject.ext.pomScmDeveloperConnection
                            url = rootProject.ext.pomUrl
                        }
                    }
                }
            }
        }

        signing {
            required {
                gradle.taskGraph.allTasks.any { t ->
                    (t.name.toLowerCase().contains('publish') || t.name.toLowerCase().contains('sonatype')) &&
                    !t.name.toLowerCase().contains('mavenlocal')
                }
            }

            def signingKey = findProperty('signingKey') as String
            def signingPassword = findProperty('signingPassword') as String
            if (signingKey && signingPassword) {
                useInMemoryPgpKeys(signingKey, signingPassword)
            }

            sign publishing.publications
        }
    }
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl = uri('https://ossrh-staging-api.central.sonatype.com/service/local/')
            snapshotRepositoryUrl = uri('https://central.sonatype.com/repository/maven-snapshots/')
            username = findProperty('sonatypeUsername') as String
            password = findProperty('sonatypePassword') as String
        }
    }
}
